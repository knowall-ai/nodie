name: Release
# Pushing a version tag (v1.2.3, matching package.json) builds the Linux .deb and
# publishes it with SHA256SUMS. Installers verify the .deb against SHA256SUMS.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Build .deb
        run: npm run dist
      - name: Check the package (name, /opt payload, AppArmor profile, permissions, no secrets)
        run: npm run dist:check
      - name: Checksums
        working-directory: dist
        run: sha256sum nodie_*.deb | tee SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/nodie_*.deb dist/SHA256SUMS --title "Nod.ie $GITHUB_REF_NAME" --generate-notes --verify-tag
